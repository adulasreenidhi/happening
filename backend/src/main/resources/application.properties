spring.application.name=happening

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/happening_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=8080

app.jwt.secret=${JWT_SECRET:}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.frontend.origin=${FRONTEND_ORIGIN:http://localhost:5173}
app.ai.enabled=${AI_ASSISTANT_ENABLED:true}
app.ai.api-key=${OPENAI_API_KEY:}
app.ai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
app.ai.chat-model=${OPENAI_CHAT_MODEL:gpt-4o-mini}
app.ai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.info.env.enabled=false

logging.level.root=INFO
logging.level.com.happening=INFO
